<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Student Blog</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <script type="module" src="js/theme.js?v=3" defer></script>
    <script type="module" src="js/app.js?v=5" defer></script>
</head>

<body>
    <header class="site-header">
        <nav class="navigation container" aria-label="Main navigation">
            <a class="logo" href="index.html">Student Blog</a>
            <div class="nav-actions">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="blogs.html">Blogs</a>
                <a class="nav-link" href="author.html">Author</a>
                <a class="nav-link" href="add-blog.html">Write</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="nav-link" href="dashboard.html">Dashboard</a>
                <div class="theme-picker">
                    <button id="theme-toggle" class="theme-button" type="button" aria-label="Choose colour theme"
                        title="Choose colour theme" aria-haspopup="true" aria-expanded="false"
                        aria-controls="theme-options">
                        <span class="theme-wheel" aria-hidden="true"></span>
                    </button>
                    <div id="theme-options" class="theme-options" role="group" aria-label="Colour themes" hidden>
                        <p class="theme-options-label">Colour theme</p>
                        <button class="theme-choice" type="button" data-theme-choice="paper" aria-label="Paper theme"
                            aria-pressed="false"><span class="theme-swatch swatch-paper"
                                aria-hidden="true"></span>Paper</button>
                        <button class="theme-choice" type="button" data-theme-choice="grove" aria-label="Grove theme"
                            aria-pressed="false"><span class="theme-swatch swatch-grove"
                                aria-hidden="true"></span>Grove</button>
                        <button class="theme-choice" type="button" data-theme-choice="tide" aria-label="Tide theme"
                            aria-pressed="false"><span class="theme-swatch swatch-tide"
                                aria-hidden="true"></span>Tide</button>
                        <button class="theme-choice" type="button" data-theme-choice="night" aria-label="Night theme"
                            aria-pressed="false"><span class="theme-swatch swatch-night"
                                aria-hidden="true"></span>Night</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="posts-section container" id="posts">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">The journal</p>
                    <h1>All blogs</h1>
                </div>
                <p id="message" class="message" role="status"></p>
            </div>
            <div class="post-tools">
                <label for="search-posts">Search posts</label>
                <input id="search-posts" type="search" placeholder="Search by title or content">
                <label for="category-filter">Category</label>
                <select id="category-filter">
                    <option value="all">All categories</option>
                </select>
            </div>
            <div id="posts-grid" class="posts-grid" aria-live="polite"></div>
            <div id="pagination" class="pagination" aria-label="Post pages"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Student Blog &copy; 2026</p>
    </footer>
</body>

</html>
